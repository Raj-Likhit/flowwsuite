<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Flowwsuite — Your personal productivity toolkit. Attendance tracking with the 75% rule and secure image-to-PDF conversion, all client-side." />
  <meta name="theme-color" content="#0A0A0A" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://va.vercel-scripts.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data: https://*.supabase.co https://api.dicebear.com; connect-src 'self' https://*.supabase.co https://va.vercel-scripts.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none';">

  <!-- Open Graph -->
  <meta property="og:title" content="Flowwsuite — Productivity Tools" />
  <meta property="og:description" content="Track attendance & convert images to PDF. Private, fast, unlimited." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('theme-preference');
        var validThemes = ['indigo', 'obsidian', 'crimson', 'forest'];
        if (savedTheme && validThemes.indexOf(savedTheme) !== -1) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else {
          document.documentElement.setAttribute('data-theme', 'indigo');
        }
        if (localStorage.getItem('high-contrast-preference') === 'true') {
          document.documentElement.classList.add('high-contrast');
        }
      } catch (e) {}
    })();
  </script>

  <title>Flowwsuite — Professional Productivity Toolkit</title>
  
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Flowwsuite",
    "operatingSystem": "Any",
    "applicationCategory": "ProductivityApplication",
    "description": "Client-side productivity toolkit for calculating attendance (75% rule) and editing/merging PDF documents securely in the browser.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
